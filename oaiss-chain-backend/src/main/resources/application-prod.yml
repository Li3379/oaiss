# Production profile
# Usage: SPRING_PROFILES_ACTIVE=prod java -jar app.jar
# This profile intentionally avoids localhost and weak defaults. Missing secrets
# should fail at startup via Spring placeholders or SecurityStartupValidator.

server:
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${SERVER_SHUTDOWN_TIMEOUT:30s}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:30000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:0}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    validate-on-migrate: true
    repair-on-migrate: false
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT_MS:10000}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

RSA_KEK: ${RSA_KEK}

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET}
  presigned-url-expiry: ${MINIO_PRESIGNED_URL_EXPIRY_SECONDS:1800}
  max-file-size: ${MINIO_MAX_FILE_SIZE_BYTES:104857600}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    require-ops-secrets: ${REQUIRE_OPS_SECRETS:false}

ops:
  grafana:
    admin-password: ${GRAFANA_ADMIN_PASSWORD:}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    env:
      show-values: never

ml:
  service:
    url: ${ML_SERVICE_URL}
    secret: ${ML_SERVICE_SECRET:}
    connect-timeout: ${ML_SERVICE_CONNECT_TIMEOUT:5s}
    read-timeout: ${ML_SERVICE_READ_TIMEOUT:30s}

fabric:
  enabled: ${FABRIC_ENABLED:false}
  msp-id: ${FABRIC_MSP_ID:Org1MSP}
  channel-name: ${FABRIC_CHANNEL_NAME:mychannel}
  chaincode-name: ${FABRIC_CHAINCODE_NAME:carbon-chaincode}
  peer-endpoint: ${FABRIC_PEER_ENDPOINT:}
  tls-enabled: ${FABRIC_TLS_ENABLED:true}
  peer-tls-cert-path: ${FABRIC_PEER_TLS_CERT_PATH:}
  cert-path: ${FABRIC_CERT_PATH:}
  key-path: ${FABRIC_KEY_PATH:}
  connect-timeout: ${FABRIC_CONNECT_TIMEOUT_SECONDS:30}
  submit-timeout: ${FABRIC_SUBMIT_TIMEOUT_SECONDS:60}
  ca:
    enabled: ${FABRIC_CA_ENABLED:false}
    endpoint: ${FABRIC_CA_ENDPOINT:}
    admin-name: ${FABRIC_CA_ADMIN_NAME:admin}
    admin-password: ${FABRIC_CA_ADMIN_PASSWORD:}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.oaiss.chain: ${APP_LOG_LEVEL:INFO}
    org.springframework.security: INFO
