services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-5}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-20}
      DB_POOL_CONNECTION_TIMEOUT_MS: ${DB_POOL_CONNECTION_TIMEOUT_MS:-30000}
      DB_POOL_LEAK_DETECTION_MS: ${DB_POOL_LEAK_DETECTION_MS:-0}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST is required}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      RSA_KEK: ${RSA_KEK:?RSA_KEK is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
      MINIO_PRESIGNED_URL_EXPIRY_SECONDS: ${MINIO_PRESIGNED_URL_EXPIRY_SECONDS:-1800}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:8001}
      ML_SERVICE_SECRET: ${ML_SERVICE_SECRET:?ML_SERVICE_SECRET is required}
      ML_SERVICE_CONNECT_TIMEOUT: ${ML_SERVICE_CONNECT_TIMEOUT:-5s}
      ML_SERVICE_READ_TIMEOUT: ${ML_SERVICE_READ_TIMEOUT:-30s}
      REQUIRE_OPS_SECRETS: ${REQUIRE_OPS_SECRETS:-false}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      FABRIC_ENABLED: ${FABRIC_ENABLED:-false}
      FABRIC_MSP_ID: ${FABRIC_MSP_ID:-Org1MSP}
      FABRIC_CHANNEL_NAME: ${FABRIC_CHANNEL_NAME:-mychannel}
      FABRIC_CHAINCODE_NAME: ${FABRIC_CHAINCODE_NAME:-carbon-chaincode}
      FABRIC_PEER_ENDPOINT: ${FABRIC_PEER_ENDPOINT:-}
      FABRIC_TLS_ENABLED: ${FABRIC_TLS_ENABLED:-true}
      FABRIC_PEER_TLS_CERT_PATH: ${FABRIC_PEER_TLS_CERT_PATH:-}
      FABRIC_CERT_PATH: ${FABRIC_CERT_PATH:-}
      FABRIC_KEY_PATH: ${FABRIC_KEY_PATH:-}
      FABRIC_CA_ENABLED: ${FABRIC_CA_ENABLED:-false}
      FABRIC_CA_ENDPOINT: ${FABRIC_CA_ENDPOINT:-}
      FABRIC_CA_ADMIN_NAME: ${FABRIC_CA_ADMIN_NAME:-admin}
      FABRIC_CA_ADMIN_PASSWORD: ${FABRIC_CA_ADMIN_PASSWORD:-}
    volumes:
      - ${BACKEND_LOG_DIR:-./runtime-logs/backend}:/app/logs
      - ${FABRIC_SECRETS_DIR:-./secrets/fabric}:${FABRIC_SECRETS_MOUNT_PATH:-/run/secrets/fabric}:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - oaiss-private
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_CPU_LIMIT:-2.0}"
          memory: ${BACKEND_MEMORY_LIMIT:-1536M}
        reservations:
          memory: ${BACKEND_MEMORY_RESERVATION:-512M}

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    restart: unless-stopped
    volumes:
      - ${FRONTEND_LOG_DIR:-./runtime-logs/frontend}:/var/log/nginx
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - oaiss-private
    deploy:
      resources:
        limits:
          cpus: "${FRONTEND_CPU_LIMIT:-0.5}"
          memory: ${FRONTEND_MEMORY_LIMIT:-256M}

  ml-service:
    image: ${ML_SERVICE_IMAGE:?ML_SERVICE_IMAGE is required}
    restart: unless-stopped
    environment:
      MODEL_DIR: /app/models
      LOG_LEVEL: ${ML_LOG_LEVEL:-INFO}
      ML_SERVICE_SECRET: ${ML_SERVICE_SECRET:?ML_SERVICE_SECRET is required}
    volumes:
      - ${ML_LOG_DIR:-./runtime-logs/ml-service}:/app/logs
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - oaiss-private
    deploy:
      resources:
        limits:
          cpus: "${ML_CPU_LIMIT:-1.0}"
          memory: ${ML_MEMORY_LIMIT:-1024M}

networks:
  oaiss-private:
    name: oaiss-private
    internal: true
